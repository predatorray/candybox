name: Agent skills

on:
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skills.yml'
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skills.yml'

permissions:
  contents: read

jobs:
  issue-queue:
    name: Issue queue protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s .agents/skills/issue-loop/tests -v
