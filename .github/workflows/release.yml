name: Release

# Cuts a release from main, start to finish: sets the release version, runs the full test suite,
# publishes to Maven Central, tags it, creates a GitHub Release with the distribution archives, and
# moves main to the next -SNAPSHOT. Start it from the Actions tab ("Run workflow"); see RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.0. Leave empty to drop -SNAPSHOT from the current version.'
        required: false
        default: ''
      next-version:
        description: 'Next development version, e.g. 0.1.1-SNAPSHOT. Leave empty to bump the patch number.'
        required: false
        default: ''

# Never run two releases at once; never cancel one half-way through an upload.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release to Maven Central
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 with Central credentials and the signing key
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Resolve the release and next versions
        id: versions
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NEXT_VERSION: ${{ inputs.next-version }}
        run: |
          current=$(mvn -q -B -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          release="${INPUT_VERSION:-${current%-SNAPSHOT}}"
          next="${INPUT_NEXT_VERSION}"
          case "${release}" in
            ''|*-SNAPSHOT) echo "::error::Release version '${release}' must not be a SNAPSHOT"; exit 1 ;;
          esac
          if [ -z "${next}" ]; then
            if ! [[ "${release}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Cannot bump '${release}' automatically; set next-version."
              exit 1
            fi
            next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-SNAPSHOT"
          fi
          case "${next}" in
            *-SNAPSHOT) ;;
            *) echo "::error::Next version '${next}' must end in -SNAPSHOT"; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v${release}" > /dev/null; then
            echo "::error::Tag v${release} already exists"
            exit 1
          fi
          echo "Releasing ${release} (from ${current}); next version ${next}"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"

      - name: Configure the git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'

      - name: Commit and tag the release version
        env:
          RELEASE: ${{ steps.versions.outputs.release }}
        run: |
          mvn -q -B -ntp versions:set -DnewVersion="${RELEASE}" -DgenerateBackupPoms=false -DprocessAllModules
          git commit -am "Release ${RELEASE}"
          git tag -a "v${RELEASE}" -m "Release ${RELEASE}"

      # Runs the unit and integration tests too: nothing reaches Central (where it can never be
      # replaced) unless the release commit passes the whole suite. Nothing is pushed until this
      # succeeds, so a failed run leaves the repository untouched and can simply be re-run.
      - name: Build, test, sign and publish to Maven Central
        run: mvn -B -ntp -Prelease,frontend deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Push the release tag
        env:
          RELEASE: ${{ steps.versions.outputs.release }}
        run: git push origin "refs/tags/v${RELEASE}"

      - name: Create the GitHub Release with the distribution archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versions.outputs.release }}
          generate_release_notes: true
          files: |
            candybox-dist/target/candybox-*.tar.gz
            candybox-dist/target/candybox-*.zip

      # main may be protected (or have moved while the build ran), so a direct push can be
      # refused. Then the bump goes to a branch with a PR instead, which someone has to merge.
      - name: Move main to the next development version
        env:
          RELEASE: ${{ steps.versions.outputs.release }}
          NEXT: ${{ steps.versions.outputs.next }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mvn -q -B -ntp versions:set -DnewVersion="${NEXT}" -DgenerateBackupPoms=false -DprocessAllModules
          git commit -am "Prepare ${NEXT}"
          if git push origin HEAD:main; then
            echo "main is now at ${NEXT}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="release/prepare-${NEXT}"
          git push origin "HEAD:refs/heads/${branch}"
          body="Released ${RELEASE} to Maven Central (tag v${RELEASE}). Merge this to record the release commit on main and move it to ${NEXT}."
          if url=$(gh pr create --base main --head "${branch}" --title "Prepare ${NEXT}" --body "${body}"); then
            echo "main could not be pushed to directly; merge ${url} to move it to ${NEXT}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not open a PR (is 'Allow GitHub Actions to create and approve pull requests' off?). Open one from ${branch} to main by hand."
            echo "main could not be pushed to directly, and no PR could be opened: open one from \`${branch}\` to main to move it to ${NEXT}." >> "$GITHUB_STEP_SUMMARY"
          fi
