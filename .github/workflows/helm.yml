name: Helm chart

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package chart through Maven
        run: mvn -B -ntp -pl candybox-charts verify
      - name: Check rendered configuration contracts
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s candybox-charts/tests -v
      - uses: docker/setup-buildx-action@v3
      - name: Build the matching application image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: candybox:helm-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: candybox-helm
          node_image: kindest/node:v1.32.2
      - name: Install, upgrade and test demo
        run: |
          kind load docker-image candybox:helm-test --name candybox-helm
          chart=$(find candybox-charts/target -maxdepth 1 -name 'candybox-chart-*.tgz' -print -quit)
          helm install candybox "$chart" --namespace candybox --create-namespace \
            -f candybox-charts/candybox-chart/values-demo.yaml \
            --set image.repository=candybox --set image.tag=helm-test \
            --wait --timeout 10m
          helm test candybox -n candybox --logs --timeout 5m
          helm upgrade candybox "$chart" -n candybox --reuse-values --wait --timeout 10m
          helm test candybox -n candybox --logs --timeout 5m
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods,pvc,events -n candybox
          kubectl logs -n candybox --all-containers --prefix -l app.kubernetes.io/instance=candybox --tail=100
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: candybox-charts/target/candybox-chart-*.tgz
