{{- if .Values.bookkeeper.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "candybox.fullname" . }}-bookkeeper
  labels: {{ include "candybox.labels" . | nindent 4 }}
data:
  configure.sh: |
    set -euo pipefail
    cp /opt/bookkeeper/conf/bk_server.conf "$BOOKIE_CONF"
    python3 /opt/bookkeeper/scripts/apply-config-from-env.py "$BOOKIE_CONF"
    mkdir -p "$BOOKIE_LOG_DIR"
  initialize.sh: |
    source /etc/bookkeeper-scripts/configure.sh
    # Check first; initialize only an absent metadata layout. Never run metaformat.
    # Concurrent first starts are safe: after another pod wins, recheck identity.
    for attempt in $(seq 1 60); do
      if bin/bookkeeper shell whatisinstanceid; then exit 0; fi
      if bin/bookkeeper shell initnewcluster; then exit 0; fi
      sleep 5
    done
    echo 'BookKeeper metadata initialization timed out' >&2
    exit 1
{{- end }}
