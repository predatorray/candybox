{{- if and .Values.gateway.enabled .Values.gateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "candybox.fullname" . }}-gateway
  labels: {{ include "candybox.labels" . | nindent 4 }}
  {{- with .Values.gateway.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.gateway.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.gateway.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.gateway.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "candybox.fullname" . }}-gateway
                port: {number: {{ .Values.gateway.service.port }}}
{{- end }}
