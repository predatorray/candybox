apiVersion: v1
kind: Service
metadata:
  name: {{ include "candybox.fullname" . }}-node
  labels: {{ include "candybox.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{ include "candybox.selector" (dict "root" . "component" "node") | nindent 4 }}
  ports:
    - {name: client, port: 9709, targetPort: client}
    - {name: health, port: 9710, targetPort: health}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "candybox.fullname" . }}-node
  labels: {{ include "candybox.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "candybox.fullname" . }}-node
  replicas: {{ .Values.node.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{ include "candybox.selector" (dict "root" . "component" "node") | nindent 6 }}
  template:
    metadata:
      labels: {{ include "candybox.selector" (dict "root" . "component" "node") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.node.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- include "candybox.scheduling" .Values.node | nindent 6 }}
      containers:
        - name: node
          image: {{ include "candybox.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          args: [server, /etc/candybox-config/node.properties]
          ports:
            - {name: client, containerPort: 9709}
            - {name: health, containerPort: 9710}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: CANDYBOX_ADVERTISED
              value: "$(POD_NAME).{{ include "candybox.fullname" . }}-node.$(POD_NAMESPACE).svc:9709"
            - name: CANDYBOX_HEAP_OPTS
              value: {{ .Values.node.heapOpts | quote }}
            {{- with .Values.commonEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.node.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with concat .Values.commonEnvFrom .Values.node.envFrom }}
          envFrom: {{ toYaml . | nindent 12 }}
          {{- end }}
          resources: {{ toYaml .Values.node.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/candybox-config, readOnly: true}
            - {name: logs, mountPath: /opt/candybox/logs}
            - {name: tmp, mountPath: /tmp}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ include "candybox.fullname" . }}-config}
        - {name: logs, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
